name: Build DomainPcInfo MSI

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build MSI
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Show .NET version
        shell: pwsh
        run: dotnet --info

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1

      - name: List MSI files
        shell: pwsh
        run: Get-ChildItem -Path ./installer/DomainPcInfo.Setup/bin -Filter *.msi -Recurse | Select-Object FullName, Length, LastWriteTime

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: DomainPcInfo-MSI
          path: installer/DomainPcInfo.Setup/bin/Release/*.msi
          if-no-files-found: error
          retention-days: 30
