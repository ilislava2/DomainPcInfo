name: Release DomainPcInfo MSI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Read version from tag
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'

          if ($tag -notmatch '^v(\d+\.\d+\.\d+)$') {
              throw "Invalid tag '$tag'. Expected format: v1.2.3"
          }

          $version = $Matches[1]

          "PRODUCT_VERSION=$version" >> $env:GITHUB_ENV
          "MSI_NAME=DomainPcInfo-x64-$version.msi" >> $env:GITHUB_ENV

          Write-Host "Tag: $tag"
          Write-Host "Product version: $version"

      - name: Build MSI
        shell: pwsh
        run: ./scripts/build-msi.ps1 -ProductVersion $env:PRODUCT_VERSION

      - name: Verify MSI
        shell: pwsh
        run: |
          $msi = Join-Path $PWD "installer\DomainPcInfo.Setup\bin\Release\$env:MSI_NAME"

          if (-not (Test-Path $msi)) {
              throw "MSI not found: $msi"
          }

          Get-Item $msi | Select-Object FullName, Length, LastWriteTime

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msi = Join-Path $PWD "installer\DomainPcInfo.Setup\bin\Release\$env:MSI_NAME"

          gh release create "${{ github.ref_name }}" `
            "$msi" `
            --title "DomainPcInfo ${{ github.ref_name }}" `
            --generate-notes `
            --verify-tag
